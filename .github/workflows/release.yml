name: Publish Windows release

on:
  push:
    branches: [main, release/0.3]
    paths:
      - release-version.txt
      - .github/workflows/release.yml
      - scripts/publish-release.ps1
  pull_request:
    paths:
      - release-version.txt
      - .github/workflows/release.yml
      - scripts/publish-release.ps1
      - src/SurfaceNotebook/SurfaceNotebook.csproj
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-windows-release
  cancel-in-progress: false

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Validate release metadata
        shell: pwsh
        run: |
          $releaseVersion = (Get-Content -Raw release-version.txt).Trim()
          [xml]$project = Get-Content -Raw src/SurfaceNotebook/SurfaceNotebook.csproj
          if ([string]$project.Project.PropertyGroup.Version -ne $releaseVersion) { throw 'Application and release versions do not match' }
          if (-not (Test-Path "docs/releases/v$releaseVersion.md")) { throw 'Release notes are missing' }
      - name: Build and check the application
        shell: pwsh
        run: |
          dotnet build SurfaceNotebook.slnx -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
          dotnet run --project tests/SurfaceNotebook.Checks -c Release --no-build
          if ($LASTEXITCODE -ne 0) { throw 'Application checks failed' }
      - name: Package standalone executables
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release-assets -Force | Out-Null
          foreach ($architecture in @('x64', 'arm64')) {
            dotnet publish src/SurfaceNotebook -c Release -r "win-$architecture" --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:PublishTrimmed=false -p:DebugType=None -p:DebugSymbols=false -o "artifacts/release-$architecture"
            if ($LASTEXITCODE -ne 0) { throw "Publish failed for $architecture" }
            $reportedVersion = [Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path "artifacts/release-$architecture/SurfaceNotebook.exe").Path).ProductVersion
            $releaseVersion = (Get-Content -Raw release-version.txt).Trim()
            if (($reportedVersion -split '\+')[0] -ne $releaseVersion) { throw "Unexpected $architecture executable version: $reportedVersion" }
            Copy-Item -LiteralPath "artifacts/release-$architecture/SurfaceNotebook.exe" -Destination "release-assets/SurfaceNotebook-windows-$architecture.exe"
          }
          $checksums = Get-ChildItem release-assets/*.exe | Sort-Object Name | ForEach-Object {
            $digest = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$digest  $($_.Name)"
          }
          $checksums | Set-Content release-assets/SHA256SUMS.txt -Encoding ascii
      - name: Verify standalone x64 startup
        shell: pwsh
        run: |
          $executable = (Resolve-Path release-assets/SurfaceNotebook-windows-x64.exe).Path
          $appProcess = Start-Process -FilePath $executable -ArgumentList '--verify-startup' -WindowStyle Hidden -PassThru
          if (-not $appProcess.WaitForExit(60000)) {
            $appProcess.Kill()
            throw 'Published application startup timed out'
          }
          if ($appProcess.ExitCode -ne 0) { throw "Published application startup failed: $($appProcess.ExitCode)" }
      - name: Capture the actual preview interface
        shell: pwsh
        run: |
          $executable = (Resolve-Path release-assets/SurfaceNotebook-windows-x64.exe).Path
          $outputDirectory = (Resolve-Path release-assets).Path
          $appProcess = Start-Process -FilePath $executable -ArgumentList @('--capture-preview', ('"{0}"' -f $outputDirectory)) -WindowStyle Hidden -PassThru
          if (-not $appProcess.WaitForExit(60000)) {
            $appProcess.Kill()
            throw 'Preview capture timed out'
          }
          if ($appProcess.ExitCode -ne 0) { throw "Preview capture failed: $($appProcess.ExitCode)" }
          foreach ($image in @('home-light.png', 'home-dark.png', 'workspace-light.png', 'workspace-dark.png', 'paper-settings.png', 'focus-mode.png', 'portrait.png', 'compact-window.png', 'tool-inspector.png', 'tool-inspector-portrait.png', 'tool-inspector-dark.png', 'add-pen.png')) {
            if (-not (Test-Path -LiteralPath (Join-Path $outputDirectory $image))) { throw "Missing screenshot: $image" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-release-assets
          path: release-assets/
          if-no-files-found: error

  publish:
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release/0.3') && github.event_name != 'pull_request'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Windows-release-assets
          path: release-assets
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: ./scripts/publish-release.ps1
