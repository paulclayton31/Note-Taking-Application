name: Windows build and checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build SurfaceNotebook.slnx --configuration Release
      - name: Check page storage, history, and WPF initialization
        run: dotnet run --project tests/SurfaceNotebook.Checks --configuration Release --no-build
      - name: Render the writing workspace and tool inspector
        run: dotnet run --project src/SurfaceNotebook --configuration Release --no-build -- --capture-preview artifacts/preview
      - uses: actions/upload-artifact@v4
        with:
          name: SurfaceNotebook-interface-preview
          path: artifacts/preview/
          if-no-files-found: error
      - name: Publish portable x64 prototype
        run: dotnet publish src/SurfaceNotebook --configuration Release --runtime win-x64 --self-contained true --output artifacts/win-x64
      - uses: actions/upload-artifact@v4
        with:
          name: SurfaceNotebook-win-x64
          path: artifacts/win-x64/
