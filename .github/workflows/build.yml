name: Windows build and checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build SurfaceNotebook.slnx --configuration Release
      - name: Check calculation engine
        run: dotnet run --project tests/SurfaceNotebook.CalculationChecks --configuration Release --no-build
      - name: Check page storage, history, and WPF initialization
        shell: pwsh
        run: |
          $checkAssembly = Get-ChildItem tests/SurfaceNotebook.Checks/bin/Release/*/SurfaceNotebook.Checks.dll | Select-Object -First 1
          & dotnet $checkAssembly.FullName
          $checkExit = $LASTEXITCODE
          Write-Host "Application check exit code: $checkExit"
          if ($checkExit -ne 0) {
            Get-WinEvent -FilterHashtable @{LogName='Application'; StartTime=(Get-Date).AddMinutes(-3)} -ErrorAction SilentlyContinue | Where-Object { $_.ProviderName -in @('Application Error', '.NET Runtime', 'Windows Error Reporting') } | Select-Object -First 4 -ExpandProperty Message | Write-Host
            throw "Application checks exited with $checkExit"
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SurfaceNotebook-PDF-preview
          path: artifacts/pdf-preview/
          if-no-files-found: warn
      - name: Render the writing workspace and tool inspector
        run: dotnet run --project src/SurfaceNotebook --configuration Release --no-build -- --capture-preview artifacts/preview
      - uses: actions/upload-artifact@v4
        with:
          name: SurfaceNotebook-interface-preview
          path: artifacts/preview/
          if-no-files-found: error
      - name: Publish portable x64 prototype
        run: dotnet publish src/SurfaceNotebook --configuration Release --runtime win-x64 --self-contained true --output artifacts/win-x64
      - uses: actions/upload-artifact@v4
        with:
          name: SurfaceNotebook-win-x64
          path: artifacts/win-x64/
